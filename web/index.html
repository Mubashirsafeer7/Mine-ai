<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mine AI</title>
  <meta name="description" content="Mine AI — a small model, trained from scratch, running on your machine." />
  <meta name="theme-color" content="#fbfaf8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 12 16 29 4 12Z' fill='none' stroke='%23c85f22' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="gemMark" viewBox="0 0 32 32">
      <path d="M16 3 28 12 16 29 4 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    </symbol>
  </svg>

  <div class="app" id="app">

    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <div class="side-head">
        <span class="wordmark">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#gemMark" /></svg>
          Mine AI
        </span>
        <button class="icon-btn" id="collapseBtn" type="button" title="Hide sidebar" aria-label="Hide sidebar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M8 3.5v13"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg>
        New chat
      </button>

      <div class="side-search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
        <input id="searchInput" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
      </div>

      <nav class="history" id="history" aria-label="Chat history"></nav>

      <div class="side-foot">
        <span class="pulse" id="modelPulse"></span>
        <span id="modelChipText">loading</span>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h10"/></svg>
        </button>

        <button class="icon-btn only-collapsed" id="expandBtn" type="button" title="Show sidebar" aria-label="Show sidebar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M8 3.5v13"/></svg>
        </button>

        <div class="topbar-title" id="topbarTitle">New chat</div>

        <div class="topbar-actions">
          <button class="text-btn" id="railBtn" type="button">Model</button>
          <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg class="ico-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 11.7A6.6 6.6 0 0 1 8.3 4a6.6 6.6 0 1 0 7.7 7.7Z"/></svg>
            <svg class="ico-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M18.2 10h-2.1M3.9 10H1.8M15.8 4.2l-1.5 1.5M5.7 14.3l-1.5 1.5M15.8 15.8l-1.5-1.5M5.7 5.7 4.2 4.2"/></svg>
          </button>
        </div>
      </header>

      <div class="stream" id="stream">
        <div class="stream-inner">
          <section class="empty" id="empty">
            <svg class="empty-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#gemMark" /></svg>
            <h1>Ask me anything.</h1>
            <p>A small model, trained from scratch, running on your machine.</p>
            <div class="chips" id="chips">
              <button class="chip" type="button" data-q="what is your name">What is your name</button>
              <button class="chip" type="button" data-q="tum kaise kaam karte ho">How do you work</button>
              <button class="chip" type="button" data-q="koi joke sunao">Tell me a joke</button>
              <button class="chip" type="button" data-q="tumhe train kaise karte hain">How do I train you</button>
            </div>
          </section>

          <div class="messages" id="messages"></div>
        </div>
      </div>

      <button class="jump" id="jumpBtn" type="button" aria-label="Scroll to bottom" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M5 11l5 5 5-5"/></svg>
      </button>

      <div class="dock">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message Mine AI" autocomplete="off" spellcheck="false"></textarea>

          <div class="composer-foot">
            <div class="segmented" id="modeGroup" role="radiogroup" aria-label="Answer source">
              <button class="seg" type="button" role="radio" data-mode="auto" aria-checked="true">Auto</button>
              <button class="seg" type="button" role="radio" data-mode="neural" aria-checked="false">Neural</button>
              <button class="seg" type="button" role="radio" data-mode="memory" aria-checked="false">Memory</button>
            </div>

            <div class="composer-right">
              <div class="tune">
                <button class="icon-btn" id="tuneBtn" type="button" title="Settings" aria-label="Settings">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6.5h12M4 13.5h12"/><circle cx="8" cy="6.5" r="2"/><circle cx="12" cy="13.5" r="2"/></svg>
                </button>
                <div class="popover" id="tunePop" hidden>
                  <label class="tune-row">
                    <span>Temperature <b id="tempOut">0.75</b></span>
                    <input id="temperature" type="range" min="0" max="1.4" step="0.05" value="0.75" />
                  </label>
                  <label class="tune-row">
                    <span>Reply length <b id="lenOut">60</b></span>
                    <input id="maxTokens" type="range" min="16" max="160" step="4" value="60" />
                  </label>
                </div>
              </div>

              <button class="send" id="sendBtn" type="submit" aria-label="Send">
                <svg class="ico-send" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
                <svg class="ico-stop" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="2"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <aside class="rail" id="rail" aria-label="Model" hidden>
      <div class="rail-head">
        <h2>Model</h2>
        <button class="icon-btn" id="railClose" type="button" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
        </button>
      </div>

      <div class="rail-body">
        <div class="stat-grid" id="statGrid"></div>
        <section class="rail-block">
          <h3>Context</h3>
          <div class="meter"><span id="ctxFill"></span></div>
          <p class="rail-note" id="ctxNote">— / —</p>
        </section>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
